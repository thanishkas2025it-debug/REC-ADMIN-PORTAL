<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REC | Notices</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/notices.css">
</head>

<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <img src="images/logo.png" alt="REC Logo">

        <div>
            <h4>REC Portal</h4>
            <small>Student Management</small>
        </div>
    </div>

    <nav class="sidebar-menu">

        <a href="dashboard.html" class="menu-item">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="students.html" class="menu-item">
            <i class="fa-solid fa-user-graduate"></i>
            <span>Students</span>
        </a>

        <a href="attendance.html" class="menu-item">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Attendance</span>
        </a>

        <a href="marks.html" class="menu-item">
            <i class="fa-solid fa-book-open"></i>
            <span>Marks</span>
        </a>

        <a href="notices.html" class="menu-item active">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Notices</span>
        </a>

        <a href="profile.html" class="menu-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="settings.html" class="menu-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="index.html" class="menu-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>

    </div>

</aside>


<main class="main-content">

    <header class="topbar">

        <div>
            <h2>Notices</h2>
            <p>College announcements and important updates</p>
        </div>

        <div class="topbar-right">

            <button class="notification-btn">
                <i class="fa-solid fa-bell"></i>
                <span class="notification-dot"></span>
            </button>

            <div class="user-profile">
                <div class="user-avatar">A</div>

                <div class="user-info">
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>
            </div>

        </div>

    </header>


    <section class="notice-toolbar dashboard-card">

        <div class="notice-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="noticeSearch"
                placeholder="Search notices..."
                oninput="renderNotices()">

        </div>


        <select id="noticeFilter" onchange="renderNotices()">

            <option value="all">All Notices</option>
            <option value="urgent">Urgent</option>
            <option value="important">Important</option>
            <option value="general">General</option>

        </select>


        <button class="add-notice-btn" onclick="openNoticeModal()">

            <i class="fa-solid fa-plus"></i>
            Add Notice

        </button>

    </section>


    <section>

        <div id="noticeContainer" class="notice-grid"></div>

    </section>

</main>


<!-- NOTICE MODAL -->

<div class="notice-modal-overlay" id="noticeModal">

    <div class="notice-modal">

        <div class="notice-modal-header">

            <div>
                <h3 id="modalTitle">Add Notice</h3>
                <p>Create a new college announcement</p>
            </div>

            <button onclick="closeNoticeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="noticeForm">

            <input type="hidden" id="noticeId">


            <label>Notice Title</label>

            <input
                type="text"
                id="noticeTitle"
                placeholder="Enter notice title"
                required>


            <label>Description</label>

            <textarea
                id="noticeDescription"
                placeholder="Write notice details..."
                required></textarea>


            <div class="notice-form-row">

                <div>

                    <label>Priority</label>

                    <select id="noticePriority">

                        <option value="general">General</option>
                        <option value="important">Important</option>
                        <option value="urgent">Urgent</option>

                    </select>

                </div>


                <div>

                    <label>Department</label>

                    <select id="noticeDepartment">

                        <option value="All">All Departments</option>
                        <option value="IT">IT</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>

                    </select>

                </div>

            </div>


            <label>Date</label>

            <input
                type="date"
                id="noticeDate"
                required>


            <div class="notice-modal-actions">

                <button
                    type="button"
                    class="notice-cancel"
                    onclick="closeNoticeModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="notice-save">

                    <i class="fa-solid fa-check"></i>
                    Save Notice

                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/notices.js"></script>

</body>
</html>
